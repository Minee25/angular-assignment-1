<div class="bg-[#1f2022] text-white pb-16 px-4">
  <div class="max-w-5xl mx-auto">
    <hr class="border-gray-700 mb-8" />

    <div class="flex flex-col gap-2">
      <label class="text-[15px] font-medium text-gray-200">Comment</label>
      <div class="relative mt-1">
        <textarea id="comment-input"
          class="peer w-full bg-transparent border border-gray-500 rounded p-3 text-[14px] text-white placeholder-transparent focus:placeholder-gray-500 focus:outline-none focus:border-white focus:ring-1 focus:ring-white resize-y min-h-[120px] transition-colors"
          placeholder="Ex. It makes me feel..."></textarea>
        <label for="comment-input"
          class="absolute left-3 px-1 transition-all duration-200 pointer-events-none bg-transparent text-gray-300 text-[14px]
                 top-3 
                 peer-focus:top-0 peer-focus:-translate-y-1/2 peer-focus:text-[13px] peer-focus:text-white peer-focus:bg-[#1f2022]
                 peer-[:not(:placeholder-shown)]:top-0 peer-[:not(:placeholder-shown)]:-translate-y-1/2 peer-[:not(:placeholder-shown)]:text-[13px] peer-[:not(:placeholder-shown)]:text-white peer-[:not(:placeholder-shown)]:bg-[#1f2022]">
          What do you feel about this?
        </label>
      </div>

      <div class="flex justify-between items-center mt-3">
        <div class="rating rating-md gap-1.5">
          <input type="radio" name="rating" class="mask mask-heart bg-[#5b6e7a] hover:bg-[#728997]" />
          <input type="radio" name="rating" class="mask mask-heart bg-[#5b6e7a] hover:bg-[#728997]" />
          <input type="radio" name="rating" class="mask mask-heart bg-[#5b6e7a] hover:bg-[#728997]" />
          <input type="radio" name="rating" class="mask mask-heart bg-[#5b6e7a] hover:bg-[#728997]" />
          <input type="radio" name="rating" class="mask mask-heart bg-[#5b6e7a] hover:bg-[#728997]" />
        </div>
        <button
          class="bg-[#424242] hover:bg-[#525252] text-white px-6 py-1.5 rounded text-[13px] font-medium transition-colors">
          Send
        </button>
      </div>
    </div>
  </div>
</div>
